<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b3261e">
  <title>Turno Bomberos</title>
  <meta name="description" content="App para organizar el turno: dotación, tareas y cuadrante.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Turno Bomberos">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root { --rojo: #b3261e; --fondo: #f6f4f3; --texto: #1d1b1a; --suave: #6b6461; --tarjeta: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { --fondo: #171413; --texto: #f1eceb; --suave: #a8a09d; --tarjeta: #24201f; }
    }
    html, body { margin: 0; height: 100%; background: var(--rojo); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    /* La franja de la barra de estado (muesca) queda en rojo; la app ocupa el resto. */
    body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); box-sizing: border-box; }
    iframe { flex: 1; width: 100%; border: 0; background: var(--fondo); }
    .capa {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 24px; box-sizing: border-box; background: var(--fondo); color: var(--texto); text-align: center;
    }
    .capa[hidden] { display: none; }
    .capa img { width: 96px; height: 96px; border-radius: 22px; }
    .capa p { margin: 0; max-width: 340px; line-height: 1.45; }
    .capa .nota { color: var(--suave); font-size: .9rem; }
    .botones { display: grid; gap: 10px; width: 100%; max-width: 320px; }
    .botones a, .botones button {
      display: block; min-height: 48px; line-height: 48px; border-radius: 12px; font: inherit; font-weight: 700;
      text-decoration: none; border: 1px solid var(--rojo); cursor: pointer;
    }
    .principal { background: var(--rojo); color: #fff; }
    .suave { background: var(--tarjeta); color: var(--rojo); }
    .aviso {
      position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 10;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 16px;
      background: var(--texto); color: var(--fondo); border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.3); font-weight: 600;
    }
    .aviso[hidden] { display: none; }
    .aviso button { min-height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--rojo); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .puntos::after { content: ''; animation: puntos 1.2s steps(4) infinite; }
    @keyframes puntos { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  </style>
</head>
<body>
  <iframe id="app" title="Turno Bomberos" allow="web-share; clipboard-write"></iframe>

  <div class="capa" id="cargando">
    <img src="icono-192.png" alt="">
    <p class="puntos">Cargando</p>
  </div>

  <div class="aviso" id="nueva" hidden>
    <span>Hay una versión nueva</span>
    <button id="actualizar">Actualizar</button>
  </div>

  <div class="capa" id="ayuda" hidden>
    <img src="icono-192.png" alt="">
    <p><strong>La app no termina de abrir.</strong></p>
    <p class="nota" id="ayuda-texto">Puede que la conexión vaya lenta. Reintenta o ábrela en el navegador.</p>
    <div class="botones">
      <a class="principal" id="abrir-navegador" target="_blank" rel="noopener">Abrir en el navegador</a>
      <button class="suave" id="reintentar">Reintentar</button>
    </div>
  </div>

  <script>
    // Dirección de la app (despliegue /exec de Apps Script). Con #pruebas al final, la copia de pruebas.
    const PRUEBAS = location.hash === '#pruebas';
    const APP = PRUEBAS
      ? 'https://script.google.com/macros/s/AKfycbzcs-5pr055bLiMfH71UBdNTzS1SGmMSdbPZlWQPcvxB_ZlFlkfm9cVHurYnfYpPnaz/exec'
      : 'https://script.google.com/macros/s/AKfycbzOA5JUoScTMEYChgyDH_GkJlBkiZFkj7H2Mocr_pRxAdHu1gAKbtRVTGxowPmv6Ixl/exec';
    // Sesión de la app (se entra con el correo y un código): se guarda aquí, que es lo que el móvil conserva.
    const CLAVE_TESTIGO = PRUEBAS ? 'testigo:pruebas' : 'testigo';
    const testigo = {
      leer() { try { return localStorage.getItem(CLAVE_TESTIGO) || ''; } catch (e) { return ''; } },
      guardar(t) { try { if (t) localStorage.setItem(CLAVE_TESTIGO, t); else localStorage.removeItem(CLAVE_TESTIGO); } catch (e) { /* nada */ } },
    };
    // La app corre en un marco de Google (…googleusercontent.com): solo se atienden mensajes de ahí.
    const ORIGEN_APP = /^https:\/\/[a-z0-9-]+[.-]script\.googleusercontent\.com$/;
    const ESPERA_MS = 20000;

    const marco = document.getElementById('app');
    const cargando = document.getElementById('cargando');
    const ayuda = document.getElementById('ayuda');
    document.getElementById('abrir-navegador').href = APP;
    let lista = false, temporizador = null;

    function cargar() {
      lista = false;
      ayuda.hidden = true;
      cargando.hidden = false;
      marco.src = APP;
      clearTimeout(temporizador);
      // Si la app no avisa de que ha arrancado, casi siempre es la conexión.
      temporizador = setTimeout(() => {
        if (lista) return;
        cargando.hidden = true;
        if (!navigator.onLine) {
          document.getElementById('ayuda-texto').textContent = 'No hay conexión. Comprueba los datos o el wifi y reintenta.';
        }
        ayuda.hidden = false;
      }, ESPERA_MS);
    }
    document.getElementById('reintentar').onclick = cargar;

    window.addEventListener('message', e => {
      if (!ORIGEN_APP.test(e.origin) || !e.data || typeof e.data !== 'object') return;
      const m = e.data;
      if (m.turno5 === 'listo') {
        lista = true;
        clearTimeout(temporizador);
        cargando.hidden = true;
        ayuda.hidden = true;
        // La app pregunta si puede compartir a través de aquí (dentro del marco de Google no siempre le dejan).
        e.source.postMessage({ turno5: 'carcasa', compartir: !!navigator.canShare, testigo: testigo.leer() }, e.origin);
      } else if (m.turno5 === 'testigo' && typeof m.testigo === 'string') {
        testigo.guardar(m.testigo);
      } else if (m.turno5 === 'compartir') {
        const responder = error => e.source.postMessage({ turno5: 'compartido', id: m.id, error: error || '' }, e.origin);
        try {
          const archivo = new File([m.blob], m.nombre, { type: m.blob.type || 'image/png' });
          if (!navigator.canShare || !navigator.canShare({ files: [archivo] })) { responder('NoSoportado'); return; }
          navigator.share({ files: [archivo], title: m.titulo })
            .then(() => responder(''))
            .catch(err => responder((err && err.name) || 'Error'));
        } catch (err) {
          responder((err && err.name) || 'Error');
        }
      }
    });

    cargar();

    // En iOS, instalada, no se puede recargar: al volver tras un rato fuera se recarga la app sola (datos al día),
    // y si hay una versión nueva de la carcasa se avisa con un botón.
    const AUSENTE_MS = 5 * 60 * 1000;
    let oculta = 0, registro = null;
    const nueva = document.getElementById('nueva');
    document.getElementById('actualizar').onclick = () => location.reload();
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { oculta = Date.now(); return; }
      if (oculta && Date.now() - oculta > AUSENTE_MS) cargar();
      oculta = 0;
      if (registro) registro.update().catch(() => {});
    });

    if ('serviceWorker' in navigator) {
      const habiaControlador = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (habiaControlador) nueva.hidden = false; });
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(r => { registro = r; }).catch(() => {}));
    }
  </script>
</body>
</html>
